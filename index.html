<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVEN Joyería | Catálogo Exclusivo</title>
    <!-- Tipografías elegantes -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-oro: #d4af37;
            --color-oro-oscuro: #aa8416;
            --color-oscuro: #111111;
            --color-gris-fondo: #f8f9fa;
            --color-texto: #222222;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--color-gris-fondo);
            color: var(--color-texto);
        }

        /* Encabezado Principal */
        header {
            background-color: var(--color-oscuro);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem 1.5rem 1rem;
            border-bottom: 1px solid rgba(214, 175, 55, 0.3);
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            font-size: 3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
        }

        header p {
            margin: 0.5rem 0 0;
            font-size: 0.9rem;
            color: var(--color-oro);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Menú de Navegación por Categorías (Idéntico a tu Google Sites) */
        nav {
            background-color: var(--color-oscuro);
            border-bottom: 2px solid var(--color-oro);
            position: sticky;
            top: 0;
            z-index: 1000;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* Ocultar barra en Firefox */
        }

        nav::-webkit-scrollbar {
            display: none; /* Ocultar barra en Chrome/Safari */
        }

        .menu-container {
            display: flex;
            justify-content: start;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #cccccc;
            padding: 15px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .menu-btn:hover {
            color: var(--color-oro);
        }

        .menu-btn.active {
            color: var(--color-oro);
            border-bottom: 3px solid var(--color-oro);
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Contenedor del Catálogo */
        .container {
            max-width: 1300px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Tarjetas de Joyas */
        .joya-card {
            background: white;
            border-radius: 0px; /* Bordes rectos para un look refinado */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
        }

        .joya-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(214, 175, 55, 0.12);
            border-color: var(--color-oro);
        }

        .joya-img-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .joya-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .joya-card:hover .joya-img {
            transform: scale(1.05);
        }

        .joya-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .joya-categoria {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .joya-nombre {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            margin: 0 0 8px 0;
            font-weight: 600;
            color: var(--color-oscuro);
            line-height: 1.2;
        }

        .joya-material {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 20px;
        }

        .joya-compra-bloque {
            margin-top: auto;
            border-top: 1px solid #f5f5f5;
            padding-top: 15px;
        }

        .joya-precio {
            font-size: 1.4rem;
            color: var(--color-oscuro);
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        /* Botón de WhatsApp */
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--color-oscuro);
            color: white;
            text-decoration: none;
            padding: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border: 1px solid var(--color-oscuro);
        }

        .btn-whatsapp:hover {
            background-color: transparent;
            color: var(--color-oscuro);
            border-color: var(--color-oscuro);
        }

        .agotado-tag {
            font-size: 0.75rem;
            background: #fdf2f2;
            color: #ec5959;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading-text {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.6rem;
            padding: 80px 0;
            color: #888;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <!-- Encabezado de Marca -->
    <header>
        <h1>RAVEN Joyería</h1>
        <p>Catálogo Exclusivo de Piezas Únicas</p>
    </header>

    <!-- Menú Dinámico con tus Secciones Reales de Google Sites -->
    <nav>
        <div class="menu-container">
            <button class="menu-btn active" onclick="filtrarCategoria('todo')">Ver Todo</button>
            <button class="menu-btn" onclick="filtrarCategoria('Cadenas Hombre')">Cadenas Hombre</button>
            <button class="menu-btn" onclick="filtrarCategoria('Cadena Dama')">Cadena Dama</button>
            <button class="menu-btn" onclick="filtrarCategoria('Manillas')">Manillas</button>
            <button class="menu-btn" onclick="filtrarCategoria('Esclavas')">Esclavas</button>
            <button class="menu-btn" onclick="filtrarCategoria('Anillos Dama')">Anillos Dama</button>
            <button class="menu-btn" onclick="filtrarCategoria('Anillos Hombre')">Anillos Hombre</button>
            <button class="menu-btn" onclick="filtrarCategoria('Argollas')">Argollas</button>
            <button class="menu-btn" onclick="filtrarCategoria('Aretes')">Aretes</button>
            <button class="menu-btn" onclick="filtrarCategoria('Topos')">Topos</button>
            <button class="menu-btn" onclick="filtrarCategoria('Tobilleras')">Tobilleras</button>
            <button class="menu-btn" onclick="filtrarCategoria('Dijes')">Dijes</button>
            <button class="menu-btn" onclick="filtrarCategoria('Relojes')">Relojes</button>
        </div>
    </nav>

    <div class="container">
        <div id="catalogo" class="catalogo-grid">
            <div class="loading-text">Cargando colección de lujo...</div>
        </div>
    </div>
    <script>
        // 1. REEMPLAZA CON TU ENLACE REAL TERMINADO EN pub?output=csv
        const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsX8vbfKM4vq_c--_FgUCHUe3PNkBLiDhGYqsVW2jKt31MeiQA2VysftzeBbCQnoDjCsMDos7m5453/pubhtml";

        // 2. REEMPLAZA CON TU NÚMERO DE WHATSAPP (Código de país + número, sin espacios ni el signo +)
        const TELEFONO_WHATSAPP = "573205147577"; 

        let todasLasJoyas = [];

        async function cargarDatos() {
            try {
                const respuesta = await fetch(URL_CSV);
                const textoCsv = await respuesta.text();
                
                const filas = textoCsv.split("\n").map(fila => fila.split(","));
                const encabezados = filas[0].map(h => h.trim().toLowerCase());
                
                todasLasJoyas = [];

                for (let i = 1; i < filas.length; i++) {
                    if (filas[i].length < encabezados.length) continue; 

                    const joya = {};
                    encabezados.forEach((encabezado, index) => {
                        joya[encabezado] = filas[i][index]?.trim();
                    });

                    if (!joya.nombre) continue;
                    todasLasJoyas.push(joya);
                }
                
                renderizarProductos(todasLasJoyas);

            } catch (error) {
                console.error("Error:", error);
                document.getElementById("catalogo").innerHTML = "<div class='loading-text'>Error al conectar con el inventario de Google Sheets.</div>";
            }
        }

        function renderizarProductos(productos) {
            const contenedor = document.getElementById("catalogo");
            contenedor.innerHTML = "";

            if(productos.length === 0) {
                contenedor.innerHTML = "<div class='loading-text'>No hay piezas disponibles en esta categoría por el momento.</div>";
                return;
            }

            productos.forEach(joya => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "joya-card";

                let bloqueCompra = "";
                const estaDisponible = joya.disponibilidad ? joya.disponibilidad.toLowerCase() === "si" : true;

                if (estaDisponible) {
                    const mensajeWhatsapp = encodeURIComponent(`Hola RAVEN Joyería, me interesa obtener más información sobre: ${joya.nombre} de la sección ${joya.categoria}.`);
                    const linkWhatsapp = `https://wa.me{TELEFONO_WHATSAPP}?text=${mensajeWhatsapp}`;

                    bloqueCompra = `
                        <span class="joya-precio">$${joya.precio}</span>
                        <a href="${linkWhatsapp}" target="_blank" class="btn-whatsapp">
                            Consultar Pieza
                        </a>
                    `;
                } else {
                    bloqueCompra = `<div class="agotado-tag">Pieza Agotada</div>`;
                }

                tarjeta.innerHTML = `
                    <div class="joya-img-container">
                        <img class="joya-img" src="${joya.imagen}" alt="${joya.nombre}">
                    </div>
                    <div class="joya-info">
                        <div class="joya-categoria">${joya.categoria}</div>
                        <h2 class="joya-nombre">${joya.nombre}</h2>
                        <div class="joya-material">Material: ${joya.material}</div>
                        <div class="joya-compra-bloque">
                            ${bloqueCompra}
                        </div>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        function filtrarCategoria(categoriaSeleccionada) {
            const botones = document.querySelectorAll('.menu-btn');
            botones.forEach(btn => btn.classList.remove('active'));

            if (event && event.target) {
                event.target.classList.add('active');
            }

            if (categoriaSeleccionada === 'todo') {
                renderizarProductos(todasLasJoyas);
            } else {
                const filtrados = todasLasJoyas.filter(joya => joya.categoria && joya.categoria.toLowerCase() === categoriaSeleccionada.toLowerCase());
                renderizarProductos(filtrados);
            }
        }

        // Inicializar la carga
        cargarDatos();
    </script>
</body>
</html>
